image:
  repository: ghcr.io/git-fabric/chat
  tag: latest
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Secrets — must exist in the namespace before deploy
# anthropic-api-key, github-token, qdrant-api-key (optional)
secretName: fabric-chat-secrets

# In-cluster Qdrant (no auth needed)
qdrantUrl: "http://qdrant.cortex-system.svc.cluster.local:6333"

# State stored in git-steer-state repo
githubStateRepo: "ry-ops/git-steer-state"

# GHCR pull credential
imagePullSecret: ghcr-pull-secret
