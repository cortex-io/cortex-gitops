apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-steer-repos
  namespace: cortex-system
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: git-steer
  namespace: cortex-system
  labels:
    app: git-steer
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: sse
  selector:
    app: git-steer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-steer
  namespace: cortex-system
  labels:
    app: git-steer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-steer
  template:
    metadata:
      labels:
        app: git-steer
    spec:
      containers:
      - name: git-steer
        image: 10.43.170.72:5000/git-steer:latest
        command: ["git-steer"]
        ports:
        - containerPort: 3000
          name: sse
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        - name: GITHUB_ORG
          value: "cortex-io"
        - name: REDIS_URL
          value: "redis://redis.cortex-system:6379"
        - name: GIT_STEER_HOST
          value: "0.0.0.0"
        - name: GIT_STEER_PORT
          value: "3000"
        - name: GIT_STEER_CACHE_DIR
          value: "/repos"
        - name: LOG_LEVEL
          value: "INFO"
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import urllib.request, sys
              try:
                urllib.request.urlopen('http://localhost:3000/sse', timeout=3)
                sys.exit(0)
              except Exception:
                sys.exit(1)
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import urllib.request, sys
              try:
                urllib.request.urlopen('http://localhost:3000/sse', timeout=5)
                sys.exit(0)
              except Exception:
                sys.exit(1)
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: repos
          mountPath: /repos
      volumes:
      - name: repos
        persistentVolumeClaim:
          claimName: git-steer-repos
