# Shared Qdrant instance for cortex-system MCP servers
# Used by cortex-unified-mcp as the single vector store for:
#   - Conversation memory (cortex_memory_* tools)
#   - Tool routing patterns
#   - Agent interaction history
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: cortex-system
  labels:
    app: qdrant
    app.kubernetes.io/part-of: cortex-mcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: cortex-system
  labels:
    app: qdrant
    app.kubernetes.io/part-of: cortex-mcp
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
  - name: rest
    port: 6333
    targetPort: 6333
    protocol: TCP
  - name: grpc
    port: 6334
    targetPort: 6334
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: cortex-system
  labels:
    app: qdrant
    app.kubernetes.io/part-of: cortex-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.7.4
        ports:
        - containerPort: 6333
          name: rest
        - containerPort: 6334
          name: grpc
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        livenessProbe:
          httpGet:
            path: /
            port: 6333
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6333
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: qdrant-storage
        persistentVolumeClaim:
          claimName: qdrant-storage
