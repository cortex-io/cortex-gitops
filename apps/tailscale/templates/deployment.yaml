---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-ingress
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-ingress
  template:
    metadata:
      labels:
        app: tailscale-ingress
    spec:
      serviceAccountName: proxies
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k3s-worker01
      initContainers:
        - name: sysctler
          image: busybox
          command: ["/bin/sh"]
          args: ["-c", "sysctl -w net.ipv4.ip_forward=1 && sysctl -w net.ipv6.conf.all.forwarding=1"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: Always
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_USERSPACE
              value: "false"
            - name: TS_KUBE_SECRET
              value: tailscale-state
            - name: TS_HOSTNAME
              value: k3s-cluster-ingress
            - name: TS_ROUTES
              value: "10.88.145.0/24,10.88.140.0/24,10.42.0.0/16,10.43.0.0/16"
            - name: TS_ACCEPT_ROUTES
              value: "true"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
