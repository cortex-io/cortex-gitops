apiVersion: v1
kind: ConfigMap
metadata:
  name: youtube-ingestion-fixes
  namespace: cortex
data:
  extract_transcript.py: |
    #!/usr/bin/env python3
    """
    Simple YouTube transcript extractor using youtube-transcript-api
    Outputs JSON to stdout for Node.js consumption
    """

    import sys
    import json
    from youtube_transcript_api import YouTubeTranscriptApi
    from youtube_transcript_api._errors import TranscriptsDisabled, NoTranscriptFound

    def extract_transcript(video_id, language='en'):
        """Extract transcript and return as JSON"""
        try:
            # Fetch using instance method
            api = YouTubeTranscriptApi()
            data = api.fetch(video_id, [language])
            
            # Convert to our format (attributes are: text, start, duration)
            result = {
                'success': True,
                'segments': [
                    {
                        'text': item.text,
                        'offset': int(item.start * 1000),  # Convert seconds to ms
                        'duration': int(item.duration * 1000)  # Convert seconds to ms
                    }
                    for item in data
                ],
                'language': language
            }
            print(json.dumps(result))
            return 0
        except TranscriptsDisabled:
            print(json.dumps({'success': False, 'error': 'Transcripts are disabled for this video'}))
            return 1
        except NoTranscriptFound:
            print(json.dumps({'success': False, 'error': f'No transcript found for language: {language}'}))
            return 1
        except Exception as e:
            print(json.dumps({'success': False, 'error': str(e)}))
            return 1

    if __name__ == '__main__':
        if len(sys.argv) < 2:
            print(json.dumps({'success': False, 'error': 'Usage: extract_transcript.py <video_id> [language]'}))
            sys.exit(1)
        
        video_id = sys.argv[1]
        language = sys.argv[2] if len(sys.argv) > 2 else 'en'
        
        sys.exit(extract_transcript(video_id, language))

  classifier.js: |
    /**
     * Content Classifier
     * Uses Claude to classify video content and determine relevance
     */

    import axios from 'axios';
    import { config } from '../config.js';

    export class ContentClassifier {
      constructor() {
        this.apiKey = config.anthropic.apiKey;
        this.model = config.anthropic.model;
      }

      /**
       * Classify video content
       * @param {Object} videoData - Video metadata and transcript
       * @returns {Promise<Object>}
       */
      async classify(videoData) {
        const { title, description, rawText, channelName } = videoData;

        console.log(`[ContentClassifier] Classifying video: ${title}`);

        const prompt = this.buildClassificationPrompt(title, description, rawText, channelName);

        try {
          const response = await axios.post(
            'https://api.anthropic.com/v1/messages',
            {
              model: this.model,
              max_tokens: 2048,
              messages: [
                {
                  role: 'user',
                  content: prompt
                }
              ]
            },
            {
              headers: {
                'x-api-key': this.apiKey,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json'
              }
            }
          );

          const result = response.data.content[0].text;

          // Strip markdown code fences if present (more robust version)
          let cleanedResult = result.trim();
          if (cleanedResult.startsWith('```json')) {
            cleanedResult = cleanedResult.replace(/^```json\s*/, '').replace(/\s*```\s*$/, '');
          } else if (cleanedResult.startsWith('```')) {
            cleanedResult = cleanedResult.replace(/^```\s*/, '').replace(/\s*```\s*$/, '');
          }
          cleanedResult = cleanedResult.trim();

          // Parse JSON response
          const classification = JSON.parse(cleanedResult);

          console.log(`[ContentClassifier] Classification complete: ${classification.category} (relevance: ${classification.relevance_to_cortex})`);

          return classification;
        } catch (error) {
          console.error(`[ContentClassifier] Classification failed: ${error.message}`);

          // Return default classification
          return {
            category: 'other',
            relevance_to_cortex: 0.0,
            summary: 'Failed to classify content',
            key_concepts: [],
            actionable_items: [],
            tools_mentioned: [],
            tags: [],
            error: error.message
          };
        }
      }

      /**
       * Build classification prompt
       * @private
       */
      buildClassificationPrompt(title, description, transcript, channelName) {
        // Truncate transcript if too long (keep first 8000 words)
        const truncatedTranscript = this.truncateText(transcript, 8000);

        return `You are a content classifier for Cortex, an AI-powered infrastructure management system.

    Analyze this YouTube video and provide a structured classification.

    VIDEO INFORMATION:
    Title: ${title}
    Channel: ${channelName}
    Description: ${description}

    TRANSCRIPT:
    ${truncatedTranscript}

    TASK:
    Classify this video according to these criteria:

    1. CATEGORY: Choose one from: tutorial, architecture, concept, tool-demo, discussion, code-walkthrough, conference-talk, lecture, review, other

    2. RELEVANCE TO CORTEX (0.0-1.0):
       - 1.0: Directly applicable (AI agents, infrastructure automation, MCP, Claude, DevOps tools)
       - 0.7-0.9: Highly relevant (software architecture, system design, observability)
       - 0.4-0.6: Moderately relevant (programming techniques, cloud platforms)
       - 0.1-0.3: Tangentially relevant (general tech topics)
       - 0.0: Not relevant

    3. SUMMARY: 2-3 sentence overview of the content

    4. KEY CONCEPTS: List of main concepts/topics covered

    5. ACTIONABLE ITEMS: Things Cortex could learn or implement
       Each item should have:
       - type: technique|tool|pattern|integration
       - description: What it is
       - implementation_notes: How it could be used

    6. TOOLS MENTIONED: List of specific tools, libraries, or technologies mentioned

    7. TAGS: Relevant tags for searchability

    Return ONLY valid JSON in this exact format:
    {
      "category": "string",
      "relevance_to_cortex": 0.0,
      "summary": "string",
      "key_concepts": ["string"],
      "actionable_items": [
        {
          "type": "technique|tool|pattern|integration",
          "description": "string",
          "implementation_notes": "string"
        }
      ],
      "tools_mentioned": ["string"],
      "tags": ["string"]
    }`;
      }

      /**
       * Truncate text to max words
       * @private
       */
      truncateText(text, maxWords) {
        const words = text.split(/\s+/);
        if (words.length <= maxWords) {
          return text;
        }
        return words.slice(0, maxWords).join(' ') + '... [truncated]';
      }
    }

    export default ContentClassifier;

  ingestion-service.js: |
    /**
     * YouTube Ingestion Service
     * Main orchestrator for the ingestion pipeline
     */

    import URLDetector from './utils/url-detector.js';
    import TranscriptExtractor from './extractors/transcript-extractor.js';
    import MetadataExtractor from './extractors/metadata-extractor.js';
    import ContentClassifier from './processors/classifier.js';
    import KnowledgeStore from './storage/knowledge-store.js';
    import ImprovementAgent from './agents/improvement-agent.js';
    import { config } from './config.js';

    export class IngestionService {
      constructor(redisClient = null) {
        this.urlDetector = new URLDetector();
        this.transcriptExtractor = new TranscriptExtractor();
        this.metadataExtractor = new MetadataExtractor();
        this.classifier = new ContentClassifier();
        this.knowledgeStore = new KnowledgeStore(redisClient);
        this.improvementAgent = new ImprovementAgent(this.knowledgeStore);
        this.redis = redisClient;
      }

      /**
       * Initialize the service
       */
      async initialize() {
        console.log('[IngestionService] Initializing...');
        await this.knowledgeStore.initialize();
        console.log('[IngestionService] Ready');
      }

      /**
       * Process a message and detect YouTube URLs
       * @param {string} message
       * @returns {Promise<Array>}
       */
      async processMessage(message) {
        console.log('[IngestionService] Processing message for YouTube URLs');

        const detectedURLs = this.urlDetector.detect(message);

        if (detectedURLs.length === 0) {
          return {
            detected: false,
            videos: []
          };
        }

        console.log(`[IngestionService] Detected ${detectedURLs.length} YouTube URL(s)`);

        const results = [];

        for (const { url, videoId } of detectedURLs) {
          try {
            // Always re-process videos (no caching)
            console.log(`[IngestionService] Processing video: ${videoId}`);

            // Ingest the video
            const knowledge = await this.ingestVideo(videoId);

            results.push({
              videoId,
              url,
              status: 'ingested',
              knowledge
            });
          } catch (error) {
            console.error(`[IngestionService] Failed to ingest ${videoId}: ${error.message}`);
            results.push({
              videoId,
              url,
              status: 'failed',
              error: error.message
            });
          }
        }

        return {
          detected: true,
          count: detectedURLs.length,
          videos: results
        };
      }

      /**
       * Ingest a single YouTube video
       * @param {string} videoId
       * @returns {Promise<Object>}
       */
      async ingestVideo(videoId) {
        console.log(`[IngestionService] Starting ingestion for video: ${videoId}`);

        const startTime = Date.now();

        // Step 1: Extract metadata
        console.log('[IngestionService] STEP 1/4: Extracting metadata...');
        const metadata = await this.metadataExtractor.extract(videoId);

        // Step 2: Extract transcript
        console.log('[IngestionService] STEP 2/4: Extracting transcript...');
        const transcript = await this.transcriptExtractor.extract(videoId);

        // Step 3: Classify content
        console.log('[IngestionService] STEP 3/4: Classifying content...');
        const classification = await this.classifier.classify({
          title: metadata.title,
          description: metadata.description,
          rawText: transcript.rawText,
          channelName: metadata.channelName
        });

        // Step 4: Synthesize knowledge
        console.log('[IngestionService] STEP 4/4: Synthesizing knowledge...');
        const knowledge = this.synthesizeKnowledge(
          videoId,
          metadata,
          transcript,
          classification
        );

        // Store knowledge
        await this.knowledgeStore.store(knowledge);

        // Analyze for improvements (async, don't wait)
        this.analyzeForImprovements(knowledge).catch(error => {
          console.error(`[IngestionService] Improvement analysis failed: ${error.message}`);
        });

        const duration = Date.now() - startTime;
        console.log(`[IngestionService] Ingestion complete in ${duration}ms`);

        return knowledge;
      }

      /**
       * Synthesize knowledge from extracted data
       * @private
       */
      synthesizeKnowledge(videoId, metadata, transcript, classification) {
        return {
          video_id: videoId,
          url: `https://www.youtube.com/watch?v=${videoId}`,
          title: metadata.title,
          channel_name: metadata.channelName,
          description: metadata.description,
          duration: metadata.duration,
          upload_date: metadata.uploadDate,
          thumbnail_url: metadata.thumbnailUrl,

          category: classification.category,
          relevance_to_cortex: classification.relevance_to_cortex,
          summary: classification.summary,
          key_concepts: classification.key_concepts || [],
          actionable_items: classification.actionable_items || [],
          tools_mentioned: classification.tools_mentioned || [],
          tags: classification.tags || [],

          transcript: {
            language: transcript.language,
            word_count: transcript.wordCount,
            has_timestamps: transcript.hasTimestamps,
            segments: transcript.segments
          },

          raw_transcript: transcript.rawText,

          ingested_at: new Date().toISOString(),
          metadata_extracted_at: metadata.extractedAt,
          transcript_extracted_at: transcript.extractedAt
        };
      }

      /**
       * Analyze knowledge for improvement opportunities
       * @private
       */
      async analyzeForImprovements(knowledge) {
        console.log('[IngestionService] Analyzing for improvements...');

        const analysis = await this.improvementAgent.analyzeVideo(knowledge);

        // Store improvement proposals in Redis
        if (this.redis && (analysis.improvements.passive.length > 0 || analysis.improvements.active.length > 0)) {
          await this.redis.lpush(
            'youtube:improvements',
            JSON.stringify(analysis)
          );

          console.log(`[IngestionService] Stored ${analysis.improvements.passive.length} passive and ${analysis.improvements.active.length} active improvements`);
        }
      }

      /**
       * Get ingestion statistics
       * @returns {Promise<Object>}
       */
      async getStats() {
        return await this.knowledgeStore.getStats();
      }

      /**
       * Search the knowledge base
       * @param {Object} query
       * @returns {Promise<Array>}
       */
      async search(query) {
        return await this.knowledgeStore.search(query);
      }

      /**
       * List all ingested videos
       * @param {number} limit
       * @returns {Promise<Array>}
       */
      async listAll(limit = 100) {
        return await this.knowledgeStore.listAll(limit);
      }

      /**
       * Perform meta-review
       * @param {Object} options
       * @returns {Promise<Object>}
       */
      async performMetaReview(options = {}) {
        return await this.improvementAgent.performMetaReview(options);
      }

      /**
       * Get pending improvements
       * @returns {Promise<Array>}
       */
      async getPendingImprovements() {
        if (!this.redis) {
          return [];
        }

        const improvements = await this.redis.lrange('youtube:improvements', 0, -1);
        return improvements.map(item => JSON.parse(item));
      }
    }

    export default IngestionService;
