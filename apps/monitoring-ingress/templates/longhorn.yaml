---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-tls
  namespace: longhorn-system
spec:
  secretName: longhorn-tls
  dnsNames:
    - longhorn.ry-ops.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-dns

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`longhorn.ry-ops.dev`)
      services:
        - name: longhorn-frontend
          port: 80
  tls:
    secretName: longhorn-tls
