# Cortex Unified MCP Server Helm Values

replicaCount: 1

image:
  repository: ghcr.io/ry-ops/cortex-unified
  pullPolicy: IfNotPresent
  tag: "a312763"

imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service
service:
  type: ClusterIP
  port: 3000
  healthPort: 8080

# Resources - minimal for resource-constrained cluster
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# Autoscaling (optional, disabled by default - use KEDA instead)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cortex-unified-mcp
          topologyKey: kubernetes.io/hostname

# Environment configuration
config:
  # Chat Activator (Chat Layer Fabric)
  chatActivatorUrl: "http://chat-activator.cortex-chat:8080"

  # Qdrant (conversation memory) - shared instance in cortex-system
  qdrantUrl: "http://qdrant.cortex-system:6333"

  # Prometheus (cluster metrics)
  prometheusUrl: "http://prometheus-server.cortex-system:80"

  # Redis (agent framework)
  redisUrl: "redis://redis.cortex-system:6379"

  # git-steer (TypeScript MCP server)
  gitSteerUrl: "http://git-steer.cortex-system:3000"

  # fabric-gateway — single MCP endpoint for all fabric apps
  # (kubernetes, proxmox, unifi, sandfly, cloudflare, tailscale, cve, git, chat)
  kubernetesMcpUrl: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"
  proxmoxMcpUrl: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"
  sandflyMcpUrl: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"
  unifiMcpUrl: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"
  n8nMcpUrl: "http://fabric-gateway.cortex-system.svc.cluster.local:3000"

  # Logging
  logLevel: "20"  # INFO

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: mcp
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: mcp
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network policy (optional)
networkPolicy:
  enabled: false
