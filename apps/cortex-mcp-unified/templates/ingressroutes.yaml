---
# External route for cortex-unified-mcp itself
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cortex-mcp-ingress
  namespace: cortex-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cortex-mcp.ry-ops.dev`)
      services:
        - name: cortex-unified-mcp
          port: 3000
  tls:
    certResolver: letsencrypt-prod

---
# Redirect proxmox-mcp.ry-ops.dev → fabric-gateway (replaces dead proxmox-mcp-server)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
