image:
  repository: ghcr.io/git-fabric/gateway
  tag: latest
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

imagePullSecret: ghcr-pull-secret

# Secret containing API credentials for fabric apps
# Create with:
#   kubectl create secret generic fabric-gateway-secrets \
#     --namespace cortex-system \
#     --from-literal=proxmox-host=... \
#     --from-literal=proxmox-user=root@pam \
#     --from-literal=proxmox-token-name=... \
#     --from-literal=proxmox-token-value=... \
#     --from-literal=unifi-api-key=... \
#     --from-literal=sandfly-host=... \
#     --from-literal=sandfly-username=... \
#     --from-literal=sandfly-password=...
secretName: fabric-gateway-secrets

# Existing secrets already in cortex-system
existingSecrets:
  anthropic: cortex-chat-secrets        # key: anthropic-api-key
  githubToken: github-token             # key: token
  cloudflare: cloudflare-mcp-secrets    # key: api-token
  tailscale: tailscale-mcp-secrets      # key: api-key, tailnet
  qdrant: fabric-chat-secrets           # key: qdrant-api-key (optional)

# In-cluster Qdrant
qdrantUrl: "http://qdrant.cortex-system.svc.cluster.local:6333"

# State repo for chat/aiana
githubStateRepo: "ry-ops/git-steer-state"
