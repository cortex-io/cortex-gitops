---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fabric-gateway-tls
  namespace: cortex-system
spec:
  secretName: fabric-gateway-tls
  dnsNames:
    - gateway.ry-ops.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod-dns

---
# CORS middleware — allows Cloudflare Pages chat UI to call the gateway
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fabric-gateway-cors
  namespace: cortex-system
spec:
  headers:
    accessControlAllowOriginList:
      - "https://chat.ry-ops.dev"
    accessControlAllowMethods:
      - GET
      - POST
      - OPTIONS
    accessControlAllowHeaders:
      - Content-Type
      - Accept
    accessControlMaxAge: 86400
    accessControlAllowCredentials: false

---
# Internal/Tailscale + Cloudflare Pages access to gateway MCP endpoint
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fabric-gateway
  namespace: cortex-system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`gateway.ry-ops.dev`)
      middlewares:
        - name: fabric-gateway-cors
      services:
        - name: fabric-gateway
          port: 3000
  tls:
    secretName: fabric-gateway-tls
