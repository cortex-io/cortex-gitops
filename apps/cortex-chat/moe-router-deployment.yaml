apiVersion: apps/v1
kind: Deployment
metadata:
  name: moe-router
  namespace: cortex-chat
  labels:
    app: moe-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moe-router
  template:
    metadata:
      labels:
        app: moe-router
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: install-deps
        image: python:3.11-slim
        command: ["pip", "install", "--target=/deps", "flask==3.0.3", "anthropic>=0.36.0", "requests>=2.31.0"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: deps
          mountPath: /deps
      containers:
      - name: moe-router
        image: python:3.11-slim
        command: ["python", "/app/simple-chat-api.py"]
        env:
        - name: PYTHONPATH
          value: /deps
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: cortex-chat-secrets
              key: anthropic-api-key
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: code
          mountPath: /app/simple-chat-api.py
          subPath: simple-chat-api.py
        - name: deps
          mountPath: /deps
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: code
        configMap:
          name: moe-router-config
      - name: deps
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: moe-router
  namespace: cortex-chat
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: moe-router
