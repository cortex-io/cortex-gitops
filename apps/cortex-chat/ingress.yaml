apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cortex-chat
  namespace: cortex-chat
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`chat.ry-ops.dev`)
    services:
    - name: cortex-chat
      port: 80
  tls:
    secretName: cortex-chat-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cortex-chat-tls
  namespace: cortex-chat
spec:
  secretName: cortex-chat-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - chat.ry-ops.dev
