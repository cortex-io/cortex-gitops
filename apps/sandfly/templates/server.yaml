---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandfly-server
  namespace: sandfly
  labels:
    app.kubernetes.io/name: sandfly-server
    app.kubernetes.io/part-of: sandfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandfly-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandfly-server
        app.kubernetes.io/part-of: sandfly
    spec:
      serviceAccountName: sandfly-setup  # needs to read secrets
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        # Wait for setup Job to create sandfly-config Secret
        - name: wait-for-config
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              until kubectl get secret sandfly-config -n sandfly 2>/dev/null; do
                echo "Waiting for sandfly-config (setup Job may still be running)..."
                sleep 10
              done
              echo "sandfly-config ready."

        # Wait for postgres
        - name: wait-for-postgres
          image: postgres:18.1
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready \
                -h sandfly-postgres.sandfly.svc.cluster.local \
                -U sandfly -d sandfly; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done
              echo "PostgreSQL ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sandfly-postgres-secret
                  key: POSTGRES_PASSWORD

      containers:
        - name: sandfly-server
          image: quay.io/sandfly/sandfly:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/opt/sandfly/start_api.sh"]
          env:
            - name: CONFIG_JSON
              valueFrom:
                secretKeyRef:
                  name: sandfly-config
                  key: config.server.json
          ports:
            - name: http
              containerPort: 8000
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /v4/status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v4/status
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 6Gi

---
apiVersion: v1
kind: Service
metadata:
  name: sandfly-server
  namespace: sandfly
  labels:
    app.kubernetes.io/name: sandfly-server
    app.kubernetes.io/part-of: sandfly
spec:
  selector:
    app.kubernetes.io/name: sandfly-server
  ports:
    - name: https
      port: 443
      targetPort: 8443
    - name: http
      port: 80
      targetPort: 8000
