---
# ServersTransport: skip TLS verification on the sandfly backend (self-signed cert)
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: sandfly-insecure
  namespace: sandfly
spec:
  insecureSkipVerify: true

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandfly-tls
  namespace: sandfly
spec:
  secretName: sandfly-tls
  dnsNames:
    - {{ .Values.hostname }}
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sandfly
  namespace: sandfly
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.hostname }}`)
      services:
        - name: sandfly-server
          port: 443
          serversTransport: sandfly-insecure
  tls:
    secretName: sandfly-tls
