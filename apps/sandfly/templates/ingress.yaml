---
# Tailscale Ingress — accessible only via Tailscale (sandfly.ry-ops.dev)
# TLS is provided by Tailscale (cert-manager not needed here)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandfly
  namespace: sandfly
  labels:
    app.kubernetes.io/name: sandfly
    app.kubernetes.io/part-of: sandfly
  annotations:
    tailscale.com/funnel: "false"  # No public funnel — Tailscale network only
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: sandfly-server
      port:
        name: https
  tls:
    - hosts:
        - {{ .Values.hostname }}
