---
# ServiceAccount used by the init container that writes generated configs to a Secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandfly-setup
  namespace: sandfly
  labels:
    app.kubernetes.io/part-of: sandfly

---
# Role: only allowed to manage the sandfly-config Secret in the sandfly namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandfly-secret-writer
  namespace: sandfly
  labels:
    app.kubernetes.io/part-of: sandfly
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandfly-setup-secret-writer
  namespace: sandfly
  labels:
    app.kubernetes.io/part-of: sandfly
subjects:
  - kind: ServiceAccount
    name: sandfly-setup
    namespace: sandfly
roleRef:
  kind: Role
  name: sandfly-secret-writer
  apiGroup: rbac.authorization.k8s.io

---
# ServiceAccount for server and node pods (no special permissions needed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandfly
  namespace: sandfly
  labels:
    app.kubernetes.io/part-of: sandfly
