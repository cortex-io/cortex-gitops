apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: cortex-knowledge
data:
  init.js: |
    // Initialize cortex_knowledge database
    db = db.getSiblingDB('cortex_knowledge');
    db.createCollection('knowledge_nodes');
    db.createCollection('knowledge_edges');
    db.createCollection('ingestion_jobs');
    print('cortex_knowledge database initialized');
