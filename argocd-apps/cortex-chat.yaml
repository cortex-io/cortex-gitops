apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortex-chat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cortex-io/cortex-gitops.git
    targetRevision: HEAD
    path: apps/cortex-chat
  destination:
    server: https://kubernetes.default.svc
    namespace: cortex-chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
